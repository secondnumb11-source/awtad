name: Awtad CI

on:
  push:
    branches: ["rebuild/**"]
    paths-ignore:
      - "package-lock.json"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Engineering constitution
        run: npm run verify:constitution

      - name: Foundation verification
        run: npm run verify:foundation

      - name: Core verification
        run: npm run verify:core

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit generated lockfile
        run: |
          if [ -f package-lock.json ] && git status --porcelain -- package-lock.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock npm dependencies"
            git push
          fi
