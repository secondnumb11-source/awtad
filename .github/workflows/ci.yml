name: Awtad CI

on:
  push:
    branches: ["rebuild/**"]
    paths-ignore:
      - "package-lock.json"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Engineering constitution
        run: npm run verify:constitution

      - name: Foundation verification
        run: npm run verify:foundation

      - name: Core verification
        run: npm run verify:core

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production startup
        run: |
          npm run start > /tmp/awtad-next.log 2>&1 &
          echo $! > /tmp/awtad-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/awtad-health.json; then
              cat /tmp/awtad-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/awtad-next.log
          exit 1

      - name: Production runtime cleanup
        if: always()
        run: |
          if [ -f /tmp/awtad-next.pid ]; then
            kill "$(cat /tmp/awtad-next.pid)" || true
          fi

      - name: Commit generated lockfile
        run: |
          if [ -f package-lock.json ] && git status --porcelain -- package-lock.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock npm dependencies"
            git push
          fi
