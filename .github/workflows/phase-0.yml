name: phase-0-gate

on:
  push:
    branches: ["rebuild/zero-start"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - run: npm run verify:constitution
      - run: npm run verify:source
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Start production server
        run: |
          npm run start > /tmp/awtad.log 2>&1 &
          echo $! > /tmp/awtad.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/awtad.log
          exit 1
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/awtad.pid ]; then kill "$(cat /tmp/awtad.pid)" || true; fi
